# Static recording preset. Enable only items fitted to your robot.
# Wrist cameras default to a parallel-gripper setup; adjust for dexterous hands.
# The recorder validates the selected IDs before it starts recording.
[preset]
name = quanta_x1
model = quanta_x1

[item.head_commands]
enabled = false
description = Head joint commands (recorded only; no commands are sent)

[item.head_depth]
enabled = false
description = Compressed head depth images; preserves raw depth and requires a depth decoder, not the color MP4 converter

[item.head_rgb]
enabled = true
description = Head color images

[item.imu]
enabled = false
description = Chassis IMU orientation, angular velocity and linear acceleration

[item.joint_states]
enabled = true
description = Whole body joint feedback; parse all published joints by name on the client

[item.left_arm_commands]
enabled = false
description = Left arm joint commands

[item.left_arm_end_pose]
enabled = true
description = Left arm end effector pose feedback

[item.left_arm_pose_commands]
enabled = false
description = Left arm end effector pose commands

[item.left_arm_wrench_local]
enabled = true
description = Left arm external force and torque in the local end effector frame

[item.left_arm_wrench_world]
enabled = true
description = Left arm external force and torque in the world frame

[item.left_gripper_commands]
enabled = false
description = Left gripper commands; requires joint-state parallel gripper or position-controlled parallel gripper on this side

[item.left_hand_commands]
enabled = false
description = Left dexterous hand joint commands; requires dexterous hand on this side

[item.left_hand_tactile]
enabled = false
description = Left dexterous hand tactile data; requires dexterous hand on this side

[item.left_wrist_image]
enabled = true
description = Left wrist camera images

[item.lift_commands]
enabled = false
description = Lift joint commands

[item.odom]
enabled = true
description = Chassis odometry pose and velocity

[item.right_arm_commands]
enabled = false
description = Right arm joint commands

[item.right_arm_end_pose]
enabled = true
description = Right arm end effector pose feedback

[item.right_arm_pose_commands]
enabled = false
description = Right arm end effector pose commands

[item.right_arm_wrench_local]
enabled = true
description = Right arm external force and torque in the local end effector frame

[item.right_arm_wrench_world]
enabled = true
description = Right arm external force and torque in the world frame

[item.right_gripper_commands]
enabled = false
description = Right gripper commands; requires joint-state parallel gripper or position-controlled parallel gripper on this side

[item.right_hand_commands]
enabled = false
description = Right dexterous hand joint commands; requires dexterous hand on this side

[item.right_hand_tactile]
enabled = false
description = Right dexterous hand tactile data; requires dexterous hand on this side

[item.right_wrist_image]
enabled = true
description = Right wrist camera images
