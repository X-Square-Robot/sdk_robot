# Static recording preset. Enable only items fitted to your robot.
# Wrist cameras default to a parallel-gripper setup; adjust for dexterous hands.
# The recorder validates the selected IDs before it starts recording.
[preset]
name = quanta_x2
model = quanta_x2

[item.head_commands]
enabled = false
description = Head joint commands (recorded only; no commands are sent)

[item.head_depth]
enabled = false
description = Compressed head depth images; preserves raw depth and requires a depth decoder, not the color MP4 converter

[item.head_joint_states]
enabled = true
description = Head pan and tilt joint states

[item.head_rgb]
enabled = true
description = Head color images

[item.imu]
enabled = false
description = Chassis IMU orientation, angular velocity and linear acceleration

[item.left_arm_end_pose]
enabled = true
description = Left arm end effector pose feedback

[item.left_arm_joint_states]
enabled = true
description = Left arm joint states

[item.left_arm_pose_commands]
enabled = false
description = Left arm end effector pose commands in the root frame

[item.left_arm_target_pose]
enabled = false
description = Left arm end effector target pose from the controller

[item.left_gripper_commands]
enabled = false
description = Left gripper opening and closing commands; requires joint-state parallel gripper or position-controlled parallel gripper on this side

[item.left_gripper_joint_states]
enabled = false
description = Left gripper joint states; requires position-controlled parallel gripper on this side

[item.left_gripper_state]
enabled = false
description = Left gripper opening state; requires joint-state parallel gripper on this side

[item.left_gripper_tactile]
enabled = false
description = Left gripper tactile data; requires joint-state parallel gripper on this side

[item.left_hand_commands]
enabled = false
description = Left dexterous hand joint commands; requires dexterous hand on this side

[item.left_hand_joint_states]
enabled = false
description = Left dexterous hand joint states; requires dexterous hand on this side

[item.left_hand_tactile]
enabled = false
description = Left dexterous hand tactile data; requires dexterous hand on this side

[item.left_wrist_image]
enabled = true
description = Left wrist camera images

[item.odom]
enabled = true
description = Chassis odometry pose and velocity

[item.right_arm_end_pose]
enabled = true
description = Right arm end effector pose feedback

[item.right_arm_joint_states]
enabled = true
description = Right arm joint states

[item.right_arm_pose_commands]
enabled = false
description = Right arm end effector pose commands in the root frame

[item.right_arm_target_pose]
enabled = false
description = Right arm end effector target pose from the controller

[item.right_gripper_commands]
enabled = false
description = Right gripper opening and closing commands; requires joint-state parallel gripper or position-controlled parallel gripper on this side

[item.right_gripper_joint_states]
enabled = false
description = Right gripper joint states; requires position-controlled parallel gripper on this side

[item.right_gripper_state]
enabled = false
description = Right gripper opening state; requires joint-state parallel gripper on this side

[item.right_gripper_tactile]
enabled = false
description = Right gripper tactile data; requires joint-state parallel gripper on this side

[item.right_hand_commands]
enabled = false
description = Right dexterous hand joint commands; requires dexterous hand on this side

[item.right_hand_joint_states]
enabled = false
description = Right dexterous hand joint states; requires dexterous hand on this side

[item.right_hand_tactile]
enabled = false
description = Right dexterous hand tactile data; requires dexterous hand on this side

[item.right_wrist_image]
enabled = true
description = Right wrist camera images

[item.waist_commands]
enabled = false
description = Waist joint commands

[item.waist_end_pose]
enabled = true
description = Waist end effector pose feedback

[item.waist_joint_states]
enabled = true
description = Waist joint states

[item.waist_pose_commands]
enabled = false
description = Waist end effector pose commands in the root frame

[item.waist_target_pose]
enabled = false
description = Waist end effector target pose from the controller
