# Static recording preset. Enable only items fitted to your robot.
# Wrist cameras default to a parallel-gripper setup; adjust for dexterous hands.
# The recorder validates the selected IDs before it starts recording.
[preset]
name = quanta_x3
model = quanta_x3

[item.arm_commands]
enabled = false
description = Joint commands for both arms

[item.chassis_rgb]
enabled = false
description = Chassis color images

[item.chest_rgb]
enabled = false
description = Chest color images

[item.head_left_eye_rgb]
enabled = true
description = Head left eye color images

[item.head_right_rgb]
enabled = true
description = Head right eye color images

[item.head_stereo_left_rgb]
enabled = false
description = Left images from the head stereo camera

[item.head_stereo_right_rgb]
enabled = false
description = Right images from the head stereo camera

[item.imu]
enabled = true
description = Chassis IMU orientation, angular velocity and linear acceleration

[item.joint_states]
enabled = true
description = Whole body joint feedback; parse all published joints by name on the client

[item.left_arm_end_pose]
enabled = true
description = Left arm end effector pose feedback in the base_link frame

[item.left_arm_pose_commands]
enabled = false
description = Left arm end effector pose commands in the base_link frame

[item.left_gripper_commands]
enabled = false
description = Left gripper commands; requires joint-state parallel gripper or position-controlled parallel gripper on this side

[item.left_hand_commands]
enabled = false
description = Left dexterous hand commands; requires dexterous hand on this side

[item.left_hand_tactile]
enabled = false
description = Left dexterous hand tactile data; requires dexterous hand on this side

[item.left_purlicue_image]
enabled = false
description = Left hand images from the camera between the thumb and index finger; requires dexterous hand on this side

[item.left_wrist_image]
enabled = true
description = Left wrist camera images; requires joint-state parallel gripper or position-controlled parallel gripper on this side

[item.odom]
enabled = true
description = Chassis odometry pose and velocity

[item.right_arm_end_pose]
enabled = true
description = Right arm end effector pose feedback in the base_link frame

[item.right_arm_pose_commands]
enabled = false
description = Right arm end effector pose commands in the base_link frame

[item.right_gripper_commands]
enabled = false
description = Right gripper commands; requires joint-state parallel gripper or position-controlled parallel gripper on this side

[item.right_hand_commands]
enabled = false
description = Right dexterous hand commands; requires dexterous hand on this side

[item.right_hand_tactile]
enabled = false
description = Right dexterous hand tactile data; requires dexterous hand on this side

[item.right_purlicue_image]
enabled = false
description = Right hand images from the camera between the thumb and index finger; requires dexterous hand on this side

[item.right_wrist_image]
enabled = true
description = Right wrist camera images; requires joint-state parallel gripper or position-controlled parallel gripper on this side

[item.waist_commands]
enabled = false
description = Waist joint commands, including the lift joint

[item.waist_end_pose]
enabled = true
description = Waist end effector pose feedback

[item.waist_pose_commands]
enabled = false
description = Waist end effector target pose
